# Version 5
project: stuff8

ct:
  id: 101
  hostname: stuff8
  template: local:vztmpl/eco-npm-rust-mongo_1_amd64.tar.zst
  storage: local-lvm
  disk: 16
  bridge: vmbr0
  ip: dhcp
  cores: 2
  memory: 4096
  swap: 1024
  unprivileged: 1

expose:
  enabled: true
  hostname: stuff8.com
  service: stuff8-frontend
  proxy_ct: proxy
  cloudflare_account: stuff8
  additional:
    - hostname: storage.stuff8.com
      service: storage-backend

deploy:
  github:
    enabled: true
    branch: main
    debounce_ms: 15000
    webhook_path: /__eco/github/deploy

# Staging footprint: a second deployment on CT 1000 exposed at
# staging.stuff8.com, redeployed by a webhook that accepts any branch except
# main (the prod deploy branch). Feature branches land here before main.
staging:
  ct: 1000

storage:
  minio:
    ct: storage
    region: us-east-1

shared_tools:
  - git
  - openssh-client
  - curl
  - jq
  - ca-certificates
  # Required by the storage domain to transcode video uploads (ffmpeg is a
  # runtime dependency of storage-backend, not a Cargo dependency).
  - ffmpeg

# Auth domain settings. Credentials stay in auth/backend/.env and are never committed.
auth:
  email_verification:
    enabled: true
    ttl_hours: 24
    mail_from_email: no-reply@stuff8.com
    mail_from_name: "Stuff8"

# The estate core repository is this estate's own project repo, not a shared
# catalog domain. It owns ecompose.yml itself, so its git address self-declares
# the estate origin here -- a fresh host needs only this manifest (or a clone of
# this repo) before running `eco up`.
composition:
  git: git@github.com:kelastanpatembok/stuff8_core.git
  branch: main

# Only the estate repo is listed. Inventory/marketplace/bidding remain composed
# via their `path:` services below (their repos are never cloned into the CT --
# Rust binaries are supplied off-CT by `eco up --remote` / the LXS registry).
domains:
  - stuff8_core

services:
  email-manager-backend:
    lxs: email-manager@1.0.1
    grants:
      secrets: [MONGODB_URI, BREVO_API_KEY, MAIL_FROM_EMAIL, MAIL_FROM_NAME]

  chat-backend:
    lxs: chat@1.0.2
    grants:
      secrets: [MONGODB_URI, REDIS_URL, JWT_SECRET]

  auth-backend:
    lxs: auth@1.0.2
    grants:
      secrets: [JWT_SECRET, MONGODB_URI]

  stuff8-frontend:
    path: stuff8_core/frontend
    runtimes:
      - node@20

  storage-backend:
    lxs: storage@1.0.5
    grants:
      secrets: [S3_ENDPOINT, S3_REGION, S3_BUCKET, S3_ACCESS_KEY, S3_SECRET_KEY]

  inventory-backend:
    path: inventory/backend
    runtimes:
      - rust
      - mongodb@7

  marketplace-backend:
    path: marketplace/backend
    runtimes:
      - rust
      - mongodb@7

  bidding-backend:
    path: bidding/backend
    runtimes:
      - rust
      - mongodb@7
  profile-backend:
    lxs: profile@1.0.2
    grants:
      secrets: [JWT_SECRET, MONGODB_URI]

  notifications-backend:
    lxs: notifications@1.0.2
    grants:
      secrets: [JWT_SECRET, MONGODB_URI]

  # rag-backend disabled temporarily: rag-backend hogged RAM/CPU and caused 524
  # timeouts across the estate. Re-enable when it can run lean.
  # rag-backend:
  #   path: rag/backend
  #   runtimes:
  #     - rust
  #     - mongodb@7
  #     - onnxruntime
