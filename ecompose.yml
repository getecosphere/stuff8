# ecompose v2 — stuff8
# Stuff8 estate (stuff8.com): personal inventory that can become a public
# marketplace. Frontend composed from source (this repo); auth, chat, storage,
# email-manager, profile, notifications composed from the LXS registry; the
# inventory/marketplace/bidding domains are built on the developer machine into
# static binaries and ship with the payload (never the LXS registry).
#
# Auth middleware model: a `gateway` LXS is the estate front door — deny-by-
# default route table generated by configgen from each service's
# `access.routes`. Undeclared paths return 403, never a catch-all forward.
#
# Builds happen on the developer machine; the server is executable-only.

project: stuff8
main: stuff8
description: "Stuff8 (stuff8.com) — inventory & marketplace: kelola barang pribadi, jual di marketplace."

ct:
  id: 201

data:
  postgres: 203
  mongo: 203

estates:
  stuff8:
    hostname: stuff8.com
    ingress: tunnel
    cloudflare_account: stuff8
    services:
      - gateway
      - stuff8-frontend
      - auth-backend
      - chat-backend
      - storage-backend
      - email-manager-backend
      - profile-backend
      - notifications-backend
      - inventory-backend
      - marketplace-backend
      - bidding-backend

expose:
  enabled: true
  hostname: stuff8.com
  service: gateway
  proxy_ct: 200
  cloudflare_account: stuff8

services:
  # ── Estate front door: default-deny gateway (auth middleware) ────────────
  gateway:
    lxs: gateway@3.0.1

  # ── Source services (built locally, shipped as binaries) ─────────────────
  stuff8-frontend:
    path: frontend
    runtimes: [node@20]
    access:
      routes:
        # The SPA shell is public (homepage, marketplace browsing, auth pages).
        # All API routes below override this catch-all via longer prefixes.
        - path: /*
          level: public

  inventory-backend:
    path: ../inventory/backend
    binary: inventory-backend
    runtimes: [rust, mongodb@7]
    access:
      routes:
        - path: /api/inventory/health
          level: public
        - path: /api/inventory/*
          level: auth

  marketplace-backend:
    path: ../marketplace/backend
    binary: marketplace-backend
    runtimes: [rust, mongodb@7]
    access:
      routes:
        # Stuff8 is a public marketplace: browsing and listing reads are open.
        # Write/owner endpoints (sync-item, mark-sold, ...) are self-enforced
        # by the backend (authenticated_owner) — the frontend sends Bearer on
        # those, so the gateway lets them through and the backend gates them.
        - path: /api/marketplace/*
          level: public

  bidding-backend:
    path: ../bidding/backend
    binary: bidding-backend
    runtimes: [rust, mongodb@7]
    access:
      routes:
        # Public marketplace: bid browsing is open; write/action endpoints
        # (bids, messages, accept, ...) are self-enforced by the backend.
        - path: /api/bidding/*
          level: public

  # ── Reusable capabilities from the LXS registry ──────────────────────────
  auth-backend:
    lxs: auth@3.0.1
    grants: { secrets: [JWT_SECRET, MONGODB_URI, SERVER_PORT] }
    access:
      routes:
        - path: /api/auth/login
          level: public
        - path: /api/auth/register
          level: public
        - path: /api/auth/verify-email
          level: public
        - path: /api/auth/users/check-existence
          level: public
        - path: /api/auth/*
          level: auth
        - path: /auth-api/auth/login
          level: public
          strip: /auth-api
          rewrite: /api
        - path: /auth-api/auth/register
          level: public
          strip: /auth-api
          rewrite: /api
        - path: /auth-api/auth/verify-email
          level: public
          strip: /auth-api
          rewrite: /api
        - path: /auth-api/auth/users/check-existence
          level: public
          strip: /auth-api
          rewrite: /api
        - path: /auth-api/*
          level: auth
          strip: /auth-api
          rewrite: /api

  chat-backend:
    lxs: chat@2.0.0
    grants: { secrets: [SERVER_PORT, API_BASE_PATH, MONGODB_URI, REDIS_URL, JWT_SECRET] }
    access:
      routes:
        - path: /api/chat/* 
          level: auth

  storage-backend:
    lxs: storage@1.0.7
    config:
      S3_BUCKET: stuff8-storage
    grants: { secrets: [SERVER_PORT, API_BASE_URL, S3_ENDPOINT, S3_REGION, S3_BUCKET, S3_ACCESS_KEY, S3_SECRET_KEY] }
    access:
      routes:
        # Photos load in <img> tags (no Bearer possible) and the storage LXS
        # is open by design — content and uploads are public on the estate.
        - path: /api/storage/*
          level: public

  email-manager-backend:
    lxs: email-manager@2.1.3
    grants: { secrets: [SERVER_PORT, API_BASE_PATH, MONGODB_URI, BREVO_API_KEY, MAIL_FROM_EMAIL, MAIL_FROM_NAME] }

  profile-backend:
    lxs: profile@1.0.3
    grants: { secrets: [MONGODB_URI, JWT_SECRET, SERVER_PORT, API_BASE_URL] }
    access:
      routes:
        # Reads are public (seller info on public marketplace pages); the
        # profile LXS enforces Bearer on all writes itself.
        - path: /api/profile/*
          level: public

  notifications-backend:
    lxs: notifications@2.0.0
    grants: { secrets: [PORT, API_BASE_PATH, MONGODB_URI, JWT_SECRET] }
    access:
      routes:
        - path: /api/notifications/*
          level: auth

auth:
  email_verification:
    enabled: false
  roles:
    - name: public
      level: public
    - name: authenticated
      level: auth
      default: true
